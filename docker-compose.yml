services:

  frontend:
    build:
      context: ./sipeta-frontend
    image: sipeta-frontend:latest
    ports:
      - "5173:80"
    networks:
      - sipeta-network
    deploy:
      replicas: 1

  backend:
    build:
      context: ./sipeta-frontend
    image: sipeta-backend:latest
    ports:
      - "8000:8000"
    volumes:
      - /home/Kelompok8/SIPETA_WEB/.env:/var/www/.env  # 🔥 Gunakan bind mount absolut agar Swarm tidak bingung
    networks:
      - sipeta-network
    deploy:
      replicas: 1

  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: sipeta
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    expose:
      - "5432"
    volumes:
      - sipeta_db_data:/var/lib/postgresql/data  # 🔥 Brankas data untuk Swarm
    networks:
      - sipeta-network
    deploy:
      replicas: 1

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - /home/Kelompok8/SIPETA_WEB/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - sipeta-network
    deploy:
      replicas: 1

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - /home/Kelompok8/SIPETA_WEB/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - sipeta-network
    deploy:
      replicas: 1

  grafana:
    image: grafana/grafana
    user: "0"
    ports:
      - "3000:3000"
    networks:
      - sipeta-network
    deploy:
      replicas: 1

  node-exporter:
    image: prom/node-exporter
    ports:
      - "9100:9100"
    networks:
      - sipeta-network
    deploy:
      replicas: 1

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    privileged: true
    networks:
      - sipeta-network
    deploy:
      replicas: 1

networks:
  sipeta-network:
    driver: overlay  # 🔥 Standar network untuk Docker Swarm

volumes:
  sipeta_db_data:
    driver: local  # 🔥 Memaksa Swarm mengunci data di harddisk lokal VPS manager